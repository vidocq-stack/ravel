<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420" role="img" aria-label="Ravel — Vidocq Configuration">
  <defs>
    <radialGradient id="ravelGoldDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f5e070"/>
      <stop offset="55%"  stop-color="#d4a827"/>
      <stop offset="100%" stop-color="#a07010"/>
    </radialGradient>
    <radialGradient id="ravelEmblemBg" cx="38%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#243a6e"/>
      <stop offset="100%" stop-color="#101e3c"/>
    </radialGradient>
  </defs>

  <!-- ═══ FOND ═══ -->
  <rect width="300" height="420" fill="#f7f1e3"/>

  <!-- ═══ CADRE DOUBLE ═══ -->
  <rect x="5"  y="5"  width="290" height="410" rx="2" fill="none" stroke="#1c2f5e" stroke-width="2.5"/>
  <rect x="10" y="10" width="280" height="400" rx="1" fill="none" stroke="#1c2f5e" stroke-width="0.7"/>

  <!-- Losanges dorés aux quatre coins -->
  <polygon points="5,14  14,5  23,14  14,23" fill="#c9a227"/>
  <polygon points="277,14 286,5 295,14 286,23" fill="#c9a227"/>
  <polygon points="5,406  14,397  23,406  14,415" fill="#c9a227"/>
  <polygon points="277,406 286,397 295,406 286,415" fill="#c9a227"/>

  <!-- ═══ LIBELLÉ HAUT ═══ -->
  <text x="150" y="36" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="8" letter-spacing="2.8" fill="#1c2f5e" opacity="0.75">IMPLÉMENTATION MICROPROFILE CONFIG</text>

  <!-- ═══ EMBLÈME CENTRAL ═══ -->
  <!-- Halo extérieur doux -->
  <circle cx="150" cy="183" r="111" fill="#1c2f5e" opacity="0.12"/>

  <!-- Disque principal bleu marine -->
  <circle cx="150" cy="183" r="108" fill="url(#ravelEmblemBg)"/>

  <!-- ── Cercles concentriques : crescendo du Boléro ──
       Du plus large (le plus discret) vers le centre (le plus intense),
       comme la mélodie qui s'amplifie à chaque reprise. -->
  <circle cx="150" cy="183" r="101" fill="none" stroke="#c9a227" stroke-width="0.7"  opacity="0.28"/>
  <circle cx="150" cy="183" r="91"  fill="none" stroke="#c9a227" stroke-width="0.85" opacity="0.38"/>
  <circle cx="150" cy="183" r="80"  fill="none" stroke="#c9a227" stroke-width="1.05" opacity="0.48"/>
  <circle cx="150" cy="183" r="68"  fill="none" stroke="#c9a227" stroke-width="1.3"  opacity="0.58"/>
  <circle cx="150" cy="183" r="55"  fill="none" stroke="#c9a227" stroke-width="1.6"  opacity="0.70"/>
  <circle cx="150" cy="183" r="40"  fill="none" stroke="#c9a227" stroke-width="2.1"  opacity="0.83"/>
  <circle cx="150" cy="183" r="24"  fill="none" stroke="#c9a227" stroke-width="2.6"  opacity="0.97"/>

  <!-- ── Grille radiale : précision mathématique de Ravel ──
       4 lignes principales (axes cardinaux + diagonaux) -->
  <g stroke="#c9a227" stroke-width="1.0" opacity="0.52">
    <line x1="150" y1="75" x2="150" y2="291" transform="rotate(0   150 183)"/>
    <line x1="150" y1="75" x2="150" y2="291" transform="rotate(45  150 183)"/>
    <line x1="150" y1="75" x2="150" y2="291" transform="rotate(90  150 183)"/>
    <line x1="150" y1="75" x2="150" y2="291" transform="rotate(135 150 183)"/>
  </g>
  <!-- 4 lignes secondaires (demi-angles) -->
  <g stroke="#c9a227" stroke-width="0.55" opacity="0.28">
    <line x1="150" y1="75" x2="150" y2="291" transform="rotate(22.5  150 183)"/>
    <line x1="150" y1="75" x2="150" y2="291" transform="rotate(67.5  150 183)"/>
    <line x1="150" y1="75" x2="150" y2="291" transform="rotate(112.5 150 183)"/>
    <line x1="150" y1="75" x2="150" y2="291" transform="rotate(157.5 150 183)"/>
  </g>

  <!-- ── Points dorés sur l'anneau extérieur (8 directions) ── -->
  <!-- r=101, cx=150, cy=183 -->
  <!-- 0°   : (150, 82)                          -->
  <!-- 45°  : (150+71.4, 183-71.4) = (221, 112)  -->
  <!-- 90°  : (251, 183)                          -->
  <!-- 135° : (221, 254)                          -->
  <!-- 180° : (150, 284)                          -->
  <!-- 225° : (79, 254)                           -->
  <!-- 270° : (49, 183)                           -->
  <!-- 315° : (79, 112)                           -->
  <g fill="#c9a227">
    <circle cx="150" cy="82"  r="2.8"/>
    <circle cx="221" cy="112" r="2.8"/>
    <circle cx="251" cy="183" r="2.8"/>
    <circle cx="221" cy="254" r="2.8"/>
    <circle cx="150" cy="284" r="2.8"/>
    <circle cx="79"  cy="254" r="2.8"/>
    <circle cx="49"  cy="183" r="2.8"/>
    <circle cx="79"  cy="112" r="2.8"/>
  </g>

  <!-- ── Étoile à 8 branches au centre ── -->
  <!-- Outer R=15, inner r=6.5, 16 points, angles à 22.5° -->
  <polygon transform="translate(150 183)"
    points="
      0,-15
      2.49,-6.0
      10.61,-10.61
      6.0,-2.49
      15,0
      6.0,2.49
      10.61,10.61
      2.49,6.0
      0,15
      -2.49,6.0
      -10.61,10.61
      -6.0,2.49
      -15,0
      -6.0,-2.49
      -10.61,-10.61
      -2.49,-6.0"
    fill="url(#ravelGoldDisc)" opacity="0.95"/>
  <!-- Noyau marine -->
  <circle cx="150" cy="183" r="4.5" fill="#1c2f5e"/>
  <!-- Point or central -->
  <circle cx="150" cy="183" r="1.8" fill="#c9a227"/>

  <!-- Anneau extérieur de l'emblème -->
  <circle cx="150" cy="183" r="108" fill="none" stroke="#c9a227" stroke-width="3"/>

  <!-- ═══ TITRE ═══ -->
  <text x="150" y="340" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="54" font-weight="bold" letter-spacing="9"
        fill="#1c2f5e">RAVEL</text>

  <!-- Séparateur ornemental -->
  <line x1="25"  y1="352" x2="122" y2="352" stroke="#c9a227" stroke-width="1.5"/>
  <circle cx="150" cy="352" r="4.5" fill="none" stroke="#c9a227" stroke-width="1.5"/>
  <circle cx="150" cy="352" r="1.8" fill="#c9a227"/>
  <line x1="178" y1="352" x2="275" y2="352" stroke="#c9a227" stroke-width="1.5"/>

  <!-- Sous-titre -->
  <text x="150" y="373" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="10.5" letter-spacing="2.2"
        fill="#1c2f5e">CONFIGURATION · VIDOCQ</text>

  <!-- Ligne inférieure fine -->
  <line x1="55" y1="386" x2="245" y2="386" stroke="#1c2f5e" stroke-width="0.6" opacity="0.45"/>

  <!-- Ornement bas : trois losanges dorés -->
  <g fill="#c9a227" opacity="0.75">
    <polygon points="138,396  142,400  138,404  134,400"/>
    <polygon points="148,395  153,400  148,405  143,400"/>
    <polygon points="158,396  162,400  158,404  154,400"/>
  </g>
</svg>
